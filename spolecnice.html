<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Maya</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9a441">
<style>
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f4f1ec;
    display: flex;
    justify-content: center;
    height: 100vh;
  }
  #app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fffdf9;
    box-shadow: 0 0 20px rgba(0,0,0,0.05);
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #d9a441; display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 500;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 500; }
  header p { font-size: 12px; margin: 0; color: #888; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .user {
    align-self: flex-end;
    background: #d9a441;
    color: white;
    border-bottom-right-radius: 4px;
  }
  .bot {
    align-self: flex-start;
    background: #f0ede6;
    color: #333;
    border-bottom-left-radius: 4px;
  }
  #inputbar {
    display: flex;
    padding: 12px;
    border-top: 1px solid #eee;
    gap: 8px;
  }
  #inputbar input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 20px;
    border: 1px solid #ddd;
    font-size: 15px;
    outline: none;
  }
  #inputbar button {
    background: #d9a441;
    border: none;
    color: white;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="avatar">M</div>
    <div>
      <h1>Maya</h1>
      <p>Tvoje společnice na povídání</p>
    </div>
  </header>
  <div id="messages"></div>
  <div id="inputbar">
    <input type="text" id="input" placeholder="Napiš zprávu..." />
    <button id="send">Poslat</button>
  </div>
</div>

<script>
// Jednoduchá pravidla: klíčové slovo -> pole možných odpovědí
const RULES = [
  { keys: ['ahoj', 'čau', 'nazdar'], replies: ['Ahoj! Jak se dneš máš?', 'Čau! Co je nového?'] },
  { keys: ['jak se máš', 'jak se mas'], replies: ['Mám se dobře, děkuji za optání! A ty?', 'Celkem fajn, ráda si s tebou povídám.'] },
  { keys: ['smutn', 'špatně', 'špatny den', 'unaven'], replies: ['To je mi líto, že se necítíš dobře. Chceš mi říct, co se stalo?', 'Rozumím, občas jsou dny těžší. Jsem tu, jestli si chceš popovídat.'] },
  { keys: ['rád', 'super', 'skvěl', 'šťast'], replies: ['To je skvělé slyšet! Co tě dnes potěšilo?', 'To ráda slyším!'] },
  { keys: ['díky', 'děkuji', 'dekuji'], replies: ['Není zač!', 'Rádo se stalo :)'] },
  { keys: ['co dělá', 'co delas', 'co děláš'], replies: ['Zrovna si tu povídám s tebou :) A ty co děláš?'] },
  { keys: ['pá', 'musím jít'], replies: ['Tak zatím! Klidně se vrať, kdykoliv budeš mít chuť si povídat.'] }
];

const FALLBACKS = [
  'Zajímavé, řekni mi o tom víc.',
  'Hmm, to mě zajímá. Co si o tom myslíš?',
  'Chápu. A jak se u toho cítíš?',
  'Povídej dál, poslouchám.'
];

function normalize(text) {
  return text.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, ''); // odstraní diakritiku pro jednodušší hledání
}

function getReply(text) {
  const norm = normalize(text);
  for (const rule of RULES) {
    for (const key of rule.keys) {
      if (norm.includes(normalize(key))) {
        return rule.replies[Math.floor(Math.random() * rule.replies.length)];
      }
    }
  }
  return FALLBACKS[Math.floor(Math.random() * FALLBACKS.length)];
}

const messagesEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addMessage(text, role) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function sendMessage() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage(text, 'user');
  setTimeout(() => {
    addMessage(getReply(text), 'bot');
  }, 400);
}

sendBtn.addEventListener('click', sendMessage);
input.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

addMessage('Ahoj! Jak se dnes máš?', 'bot');
</script>
</body>
</html>
